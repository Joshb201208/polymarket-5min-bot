name: CI

# Runs on pull requests so a broken change is caught before it is merged.
# It also runs on master, but note: the droplet deploys master on its own
# timer and does not wait for this to pass.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q stock_agent scripts tests

      - name: Lint (errors only)
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest
