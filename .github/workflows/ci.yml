name: CI

# Runs on pull requests so a broken change is caught before it is merged.
# The in-place updater requires this workflow's successful master push run
# and successful test job for the exact candidate SHA.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q stock_agent scripts tests

      - name: Lint (errors only)
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

  # Secret scan over the full history with the repo's .gitleaks.toml.
  # https://github.com/gitleaks/gitleaks-action (v3, Node 24; no license key
  # needed for personal-account repos, required for organization repos).
  # https://github.com/actions/checkout/releases/tag/v6
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
